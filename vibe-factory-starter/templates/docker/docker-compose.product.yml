# Production runtime stack for Vibe-Ops platforms.
# DO NOT START THIS UNTIL YOU HAVE A FIRST PLATFORM MODULE READY.
# Start: docker compose -f docker/docker-compose.product.yml up -d

version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: vibe
      POSTGRES_PASSWORD: vibe
      POSTGRES_DB: vibe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      - postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: vibe
      POSTGRES_PWD: vibe
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  opa:
    image: openpolicyagent/opa:latest
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policy"
    volumes:
      - ../policy:/policy:ro
    ports:
      - "8181:8181"

  # mcp-tools:
  #   build: ../services/mcp-tools
  #   ports:
  #     - "9000:9000"

volumes:
  pgdata:
