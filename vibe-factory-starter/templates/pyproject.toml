[project]
name = "PROJECT_NAME_PLACEHOLDER"
version = "0.0.1"
description = "A vibe-coded agentic platform"
requires-python = ">=3.11"
dependencies = ["sqlalchemy[asyncio]>=2.0,<3.0", "asyncpg>=0.29,<1.0"]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23,<1.0",
    "testcontainers[postgres]>=4.0,<5.0",
    "alembic>=1.13,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
